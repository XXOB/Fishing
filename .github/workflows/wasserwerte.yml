name: Wasserwerte aktualisieren und veröffentlichen
 
# Laeuft stuendlich (UTC) + manuell ueber den Actions-Tab.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "wasserwerte.json"
      - "*_coords.json"
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
 
permissions:
  contents: write
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
 
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
 
      - name: Playwright + Chromium installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
 
      - name: Wasserwerte abrufen
        run: python fetch_wasserwerte.py
 
      - name: Wasserwerte und Koordinaten-Caches committen
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add wasserwerte.json
          [ -f gkd_coords.json ] && git add gkd_coords.json || true
          [ -f nlwkn_coords.json ] && git add nlwkn_coords.json || true
          [ -f undine_coords.json ] && git add undine_coords.json || true
          [ -f berlin_coords.json ] && git add berlin_coords.json || true
          if ! git diff --cached --quiet; then
            git commit -m "Wasserwerte aktualisiert ($(date -u +'%Y-%m-%d %H:%MZ'))"
            git push
          else
            echo "Keine Aenderung an wasserwerte.json."
          fi
 
      - name: Pages konfigurieren
        uses: actions/configure-pages@v5
 
      - name: Seite als Artefakt packen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
 
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
 
